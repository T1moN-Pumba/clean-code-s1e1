<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="intro-part">
      <img class="intro-part__image" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
      <a class="intro-part__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="todo-section">
      <form class="todo-section__form">
        <label class="todo-section__label" for="new-task">Add Item</label>
        <input id="new-task" class="todo-section__input" type="text">
        <button class="todo-section__button">Add</button>
      </form>
    <h2 class="todo-section__title">Todo</h2>
    <ul class="todo-section__list">
      <li class="todo-section__item">
        <input type="checkbox" class="todo-section__checkbox">
        <label class="todo-section__task">Pay Bills</label>
        <input type="text" class="todo-section__edit-input">
        <button class="todo-section__edit-button">Edit</button>
        <button class="todo-section__delete-button">
          <img class="todo-section__delete-icon" src="./remove.svg" alt="delete task">
        </button>
      </li>
      <li class="todo-section__item todo-section__item--edit-mode">
        <input type="checkbox" class="todo-section__checkbox">
        <label class="todo-section__task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="todo-section__edit-input">
        <button class="todo-section__edit-button">Save</button>
        <button class="todo-section__delete-button">
          <img class="todo-section__delete-icon" src="./remove.svg" alt="delete task">
        </button>
      </li>
    </ul>
    <h2 class="todo-section__title todo-section__title--completed">Completed</h2>
      <ul class="todo-section__list todo-section__list--completed">
        <li class="todo-section__item todo-section__item--completed">
          <input type="checkbox" class="todo-section__checkbox" checked>
          <label class="todo-section__task">See the Doctor</label>
          <input type="text" class="todo-section__edit-input">
          <button class="todo-section__edit-button">Edit</button>
          <button class="todo-section__delete-button">
            <img class="todo-section__delete-icon" src="./remove.svg" alt="delete task">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
