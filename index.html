<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="intro-part">
      <img src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
      <a class="more-inf" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="todo-section">
      <form id="task-adding-section" class="task-row-wrapper">
        <label for="new-task">Add Item</label>
        <input id="new-task" class="task" type="text">
        <button>Add</button>
      </form>
    <h2 class="todo-title">Todo</h2>
    <ul id="incomplete-tasks">
      <li class="todo-item">
        <input type="checkbox">
        <label class="task">Pay Bills</label>
        <input type="text" class="task">
        <button class="edit-button">Edit</button>
        <button class="delete-button">
          <img src="./remove.svg" alt="remove">
        </button>
      </li>
      <li class="edit-mode">
        <input type="checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task">
        <button class="edit-button">Save</button>
        <button class="delete-button">
          <img src="./remove.svg">
        </button>
      </li>
    </ul>
    <h2 class="todo-title completed-title">Completed</h2>
      <ul id="completed-tasks" class="todo-list completed-list">
        <li class="todo-item completed">
          <input type="checkbox" checked>
          <label class="task">See the Doctor</label>
          <input type="text" class="task">
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
